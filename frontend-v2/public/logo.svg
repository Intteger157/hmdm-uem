<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.01 -6.87 66.26 66.26" width="64" height="64" role="img" aria-label="Singularity MDM">
  <!--
    Three accretion arms drawn into a single core: the fleet converging on one
    point of control. The gap around the core is cut with a mask rather than
    filled with a background colour, so the mark reads on a light browser tab
    strip and a dark one alike. Geometry is a logarithmic spiral offset to a
    taper; the viewBox is fitted to the drawn shape so it sits optically centred.
  -->
  <defs>
    <linearGradient id="sg" x1="6.64" y1="-6.87" x2="59.64" y2="59.39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset=".45" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <mask id="sg-core-gap">
      <rect x="0.01" y="-6.87" width="66.26" height="66.26" fill="#fff"/>
      <circle cx="32" cy="32" r="9.6" fill="#000"/>
    </mask>
  </defs>
