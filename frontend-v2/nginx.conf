server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never serve SPA fallback for API paths (bootstrap enroll must not return index.html)
    location ^~ /api/ {
        default_type text/plain;
        return 404 'API route not served by frontend. Use the MDM gateway URL.';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
