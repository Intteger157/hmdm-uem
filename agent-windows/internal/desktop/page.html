<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Singularity MDM Agent</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f17;
        --card: #111827;
        --text: #f9fafb;
        --muted: #9ca3af;
        --border: #1f2937;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, rgba(37, 99, 235, 0.08), transparent 42%), var(--bg);
      color: var(--text);
      padding: 32px 16px;
    }
    .shell {
      max-width: 520px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }
    .header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--border);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 650;
    }
    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    dl {
      margin: 0;
      padding: 8px 0;
    }
    .row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 12px;
      padding: 14px 24px;
      border-top: 1px solid var(--border);
    }
    .row:first-child {
      border-top: 0;
    }
    dt {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
    }
    dd {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
    }
    .footer {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 520px) {
      .row {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="header">
        <div class="badge">Managed device</div>
        <h1>Singularity MDM Agent</h1>
        <p class="subtitle">This computer is enrolled and monitored by your organization.</p>
      </div>
      <dl>
        <div class="row">
          <dt>Computer</dt>
          <dd>{{.Hostname}}</dd>
        </div>
        <div class="row">
          <dt>MDM server</dt>
          <dd>{{.ServerURL}}</dd>
        </div>
        <div class="row">
          <dt>Agent version</dt>
          <dd>{{.AgentVersion}}</dd>
        </div>
        <div class="row">
          <dt>Last sync</dt>
          <dd>{{.LastSync}}</dd>
        </div>
        <div class="row">
          <dt>Device ID</dt>
          <dd>{{.DeviceID}}</dd>
        </div>
      </dl>
      <div class="footer">
        Local agent information page. Data stays on this device.
      </div>
    </div>
  </div>
</body>
</html>
